version: '3.9'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/sitepulse
      - AUTH_SECRET=super-secret-change-me
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - db
    command: sh -c "npx prisma migrate deploy && npm run db:seed && npm run dev"
    volumes:
      - .:/app
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sitepulse
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data:
